name: 앱 올리기 검사
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: base 검사 코드 준비
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-check"
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            git fetch origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          if git cat-file -e "$BASE_SHA:tools/check.mjs" 2>/dev/null; then
            REF="$BASE_SHA"
          else
            REF="$HEAD_SHA"
            printf '%s\n' '초기화 PR: main에 검사 코드가 없어 이 PR의 검사 코드로 검사했습니다' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git archive "$REF" tools schema package.json package-lock.json | tar -x -C "$RUNNER_TEMP/store-check"
      - name: 검사 의존성 설치
        run: npm ci --ignore-scripts --prefix "$RUNNER_TEMP/store-check"
      - name: 앱 검사
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node "$RUNNER_TEMP/store-check/tools/check.mjs" --base "origin/$BASE_REF" --head "$HEAD_SHA" --author "$PR_AUTHOR"
