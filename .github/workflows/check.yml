name: 앱 올리기 검사
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: base 검사 코드 준비
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/trusted-check.mjs "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/store-check"
      - name: 검사 의존성 설치
        run: npm ci --ignore-scripts --prefix "$RUNNER_TEMP/store-check"
      - name: 앱 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node "$RUNNER_TEMP/store-check/tools/check.mjs" --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
